<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e293b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Chess Quest">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Chess Quest</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/pieces/wN.svg">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="stylesheet" href="styles.css?v=2.2">
</head>
<body>
  <header id="hdr"></header>
  <main id="view"></main>
  <nav id="nav"></nav>
  <script src="assets/chess.min.js?v=2.2"></script>
  <script src="puzzles.js?v=2.2"></script>
  <script src="lessons.js?v=2.2"></script>
  <script src="store.js?v=2.2"></script>
  <script src="board.js?v=2.2"></script>
  <script src="app.js?v=2.2"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.update()));
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) { refreshing = true; location.reload(); }
      });
    }
  </script>
</body>
</html>
